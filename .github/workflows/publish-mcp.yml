name: Publish MCP Server

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/**'
      - 'package.json'
      - 'server.json'
  workflow_dispatch:

# Trusted Publishing (OIDC) — no NPM_TOKEN secret needed
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'

      - name: Use latest npm (trusted publishing support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (assemble dist from committed data/)
        run: npm run build

      - name: Check version not already published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@galaxy-stack/nebula-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published — skipping publish"
            echo "SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
          else
            echo "Publishing new version $VERSION"
            echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - name: Publish
        if: env.SHOULD_PUBLISH == 'true'
        run: npm publish --access public --provenance
